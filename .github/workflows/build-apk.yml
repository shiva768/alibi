name: Build APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, master ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.configuration-cache=false
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 固定鍵で署名すると、Actions 産の APK を毎回上書きインストールできる。
      # シークレット未設定なら Gradle 既定の debug 鍵(毎回変わる)になる
      - name: Decode debug keystore
        if: ${{ env.DEBUG_KEYSTORE_BASE64 != '' }}
        run: printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Get timestamp
        id: timestamp
        run: echo "value=$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/alibi-debug-${{ steps.timestamp.outputs.value }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alibi-debug-${{ steps.timestamp.outputs.value }}
          path: app/build/outputs/apk/debug/alibi-debug-${{ steps.timestamp.outputs.value }}.apk
          retention-days: 7
